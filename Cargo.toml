[package]
name = "cbacon"
version = "0.1.0"
edition = "2024"

[features]
# The uses_notify feature is enabled by default.
default = ["uses_notify"]
uses_notify = ["notify"]

[dependencies]
notify = { version = "8.0.0", optional = true }
once_cell = "1.21.0"
regex = "1.11.1"
tokio = { version = "1.44.0", features = ["macros", "rt-multi-thread","time"] }
which = "7.0.2"

[dev-dependencies]
assert_cmd = "2.0.16"
predicate = "0.1.0"
predicates = "3.1.3"
